# Run profiles for ./run — see tools/run.py.
#
# A profile names a combination that already travels together in practice.
# Profiles inherit with `extends`; a child's switches are added to the
# parent's, and its options and env entries replace same-named ones.
#
# `./run --list` shows what is here. `./run -n <profile>` resolves a profile
# to its full command line without running it, which is what belongs in a
# session entry in docs/eicon_adsp_firmware_analysis.md.

[vars]
python = "/tmp/eicon-v34fax-venv/bin/python"
build = "artifacts/eicon-dsp/build-117-926"
kernel = "{build}/0009-diva-server-pri-30m-kernel"
tikrnl_f34 = "{build}/0258-tikrnl81.f34-task"
tikrnl_v90 = "{build}/tikrnl/0258-tikrnl81.v90-task"
tikrnl_ana = "{build}/tikrnl/0258-tikrnl81.ana-task"
tikrnl_c34 = "{build}/tikrnl/0258-tikrnl81.c34-task"

# Lab SIP account. Override host or credentials in profiles.local.toml
# (gitignored) rather than editing this file.
registrar = "asterisk.example"
sip_user = "6001"
sip_password = "6001"


# ---------------------------------------------------------------------------
# eicon_adsp_sip.py
# ---------------------------------------------------------------------------

[profiles.sip]
description = "Bare SIP endpoint: firmware paths and registrar filled in, nothing else assumed"
python = "{python}"
python_args = ["-u"]
script = "tools/eicon_adsp_sip.py"

[profiles.sip.options]
"--mips-kernel" = "{kernel}"
"--mips-tikrnl" = "{tikrnl_f34}"
"--registrar" = "{registrar}"
"--username" = "{sip_user}"
"--password" = "{sip_password}"


[profiles.native-tower]
description = "The native MIPS tower on V.90 page 14 — the standard live-call harness"
extends = "sip"
switches = [
    "--native-mips",
    "--force-info-after-v8",
    "--native-bearer-activation",
    "--tx-prbs",
    "--trace-v90d-state",
]
capture_dir = "artifacts/eicon-native-tower"

[profiles.native-tower.options]
"--law" = "pcmu"


[profiles.v34-live]
description = "Native tower with V.90 denied at this end, so the call lands on the V.34 page deterministically"
extends = "native-tower"
switches = ["--native-mips", "--force-info-after-v8", "--native-bearer-activation", "--tx-prbs"]
capture_dir = "artifacts/interop/v34-live"
capture_stem = "call"

[profiles.v34-live.options]
"--law" = "pcmu"
"--sip-port" = "5060"
"--rtp-port" = "4000"

[profiles.v34-live.env]
EICON_MODULATION = "v34,0,,33600,,33600"


[profiles.v34-fax-live]
description = "Native MIPS Class 1 V.34 fax endpoint with its Diva bootstrap host flow enabled"
extends = "v34-live"
switches = ["--v42-pty", "--at"]
drop_switches = ["--tx-prbs", "--trace-v90d-state", "--force-info-after-v8"]
capture_dir = "artifacts/interop/v34-fax-live"
capture_stem = "fax"

[profiles.v34-fax-live.env]
# Select the firmware's fax protocol row, rather than V.34 data modem mode.
# The shim reproduces fax1Up()'s V.34 setup and initial V.25/HDLC request;
# later +FTH/+FRH phases remain available at the PTY.
EICON_FAX = "1"
EICON_FAX_OPERATING_MODE = "2"
EICON_FAX_CONTROL_BITS = "0x1002"
EICON_MIPS_CARD_TYPE = "56"
# V8.F34 otherwise receives its data-modem capability mask and takes the
# V.22 branch.  This is the firmware's V.17/fax classifier input; it loads
# DIAL/FAX.F34 and then its FAX.F34 partial (bootpage 16).
# This must be a write-level pin, not EICON_FORCE_DM: V.8 rewrites the word
# and consumes it within one DSP frame, after the shim's per-sample force.
EICON_PIN_DM = "0x3fc4=0x0800"


[profiles.v42]
description = "Native tower running the experimental V.42 endpoint instead of the PRBS fill"
extends = "native-tower"
switches = ["--tx-v42", "--v42-pty"]
drop_switches = ["--tx-prbs"]


[profiles.at]
description = "V.42 endpoint with the divas4linux AT command set on a terminal that is live from launch"
extends = "v42"
# --preboot because this profile is the interactive one: the terminal is there
# to be typed at, and waiting out firmware entry after the INVITE is the one
# place that delay is felt.
switches = ["--at", "--preboot"]


[profiles.ppp]
description = "The V.42 endpoint carrying PPP: a caller authenticates, is assigned an address and gets a network"
extends = "v42"
switches = ["--ppp"]
# --v42-pty claims the same V.42 link that PPP needs.
#
# --trace-v90d-state is dropped because this is a service run, not a data-pump
# investigation. On page 14 it emits one formatted line per 3200 Hz symbol:
# 2,021,167 lines and 816 MB in a single run, written synchronously from
# inside the media tick. Our own send pacing on those runs showed routine
# 85 ms gaps and one call that slipped 1032 ms behind schedule, which starves
# the far end's jitter buffer exactly as its bursts starve ours. Put it back
# with --trace-v90d-state, ideally alongside --trace-file so the formatting
# cost is not paid on stdout.
drop_switches = ["--v42-pty", "--trace-v90d-state"]
capture_dir = "artifacts/eicon-ppp"

# There is deliberately no `ppp-v22` profile, though it is the obvious thing to
# reach for and was briefly added here. `EICON_MODULATION` does not reach V.8:
# forced v22b,0, forced v32b,0 and unforced produce identical page transitions
# on identical samples, because the V.8 menu is NORM_L at DM(0x3F09) and the
# CAI mask is not what puts it there. Pinning NORM_L does not do it either.
# Nothing in this harness currently selects a modulation, and a live call
# therefore lands on V.34 page 0x0261 whatever is asked for. The V.22 runs that
# carried LAPM, IPCP and pings are all `eicon_loopback.py --setup-gap-ms 0`,
# where V.22 is an artifact of the off-hook guard timing rather than a choice.
# Adding a profile that claims to select one only hides that. See the analysis
# doc, "EICON_MODULATION does not reach V.8".


[profiles.ppp.options]
# Live captures split cleanly in two: inbound RTP either arrives at a p99 gap
# of 22-34 ms, or in bursts with a p99 of 101-111 ms and no loss at all. The
# 40 ms default prefill absorbs the first and starves on the second -- the
# measured deficits were 224-1170 ms -- and a starved pump is handed
# substituted samples, which to a V.90 receiver is a line that changed
# underneath it. That is the difference between a perfect call and a glitchy
# one. `tools/rtp_pcap_timing.py <capture> --buffer` re-runs the measurement.
# The cost is fixed latency, which a modem does not care about; it is the
# variation that hurts.
"--rx-jitter-ms" = "200"
"--rx-depth-ms" = "1000"
