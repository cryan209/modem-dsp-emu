; Clearmode diagnostic route to the Diva, appended to [default] in
; /etc/asterisk/extensions.conf on asterisk.net.cryan.nz.
;
; 7950 reaches Diva controller 4 but routes through endpoint toprouter-bri,
; which is disallow=all/allow=alaw, so an RFC 4040 CLEARMODE offer cannot
; survive it. Endpoint 6501 allows clearmode|ulaw|alaw and already carries
; the 7910 route. 17950 therefore reaches the same BRI number over the
; clearmode-capable endpoint, leaving every existing route untouched: a
; modem call to 7950 must keep negotiating A-law as it does today.
;
; A Cisco given a CLEARMODE offer places an unrestricted-digital ISDN call;
; measured 2026-11-04 on 7910, where the Cisco answered 100 Trying and then
; 486 with Reason: Q.850;cause=17 from the analogue MultiTech card.
exten => 17950,1,NoOp(TopRouter ISDN 7950, clearmode route to Diva controller 4)
 same => n,Dial(PJSIP/6501/sip:7950@192.168.88.62:5060,30)
 same => n,Hangup()
